name: 🔍 PR Title Validation

on:
  pull_request:
    types: [opened, edited, synchronize]
    branches:
      - main

permissions:
  contents: read

jobs:
  check-title:
    runs-on: ubuntu-latest
    steps:
      - name: 📋 Validate PR Title Contains Version
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "🔍 Checking PR title: $PR_TITLE"
          if [[ "$PR_TITLE" =~ (\[v?[0-9]+\.[0-9]+\.[0-9]+\]|Release\ v?[0-9]+\.[0-9]+\.[0-9]+|v?[0-9]+\.[0-9]+\.[0-9]+) ]]; then
            echo "✅ PR title contains valid version format"
            echo "🎯 Detected version pattern in: $PR_TITLE"
            exit 0
          else
            echo "❌ PR title must contain version number!"
            echo ""
            echo "✅ Valid formats:"
            echo "   - [v1.0.0] Release version 1.0.0"
            echo "   - Release v2.3.1 - Bug fixes and improvements"
            echo "   - v1.5.0: New features and updates"
            echo ""
            echo "📝 Current title: $PR_TITLE"
            echo ""
            echo "💡 Please update your PR title to include a version number."
            exit 1

  test-release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test release note escaping
        run: bash .github/scripts/test-generate-release-notes.sh
          fi
